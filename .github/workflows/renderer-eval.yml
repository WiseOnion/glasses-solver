name: Renderer evaluation

# Compares math renderers for the written answer (Eval/RendererEval). Runs only when the
# evaluation or the written-answer page changes, or by hand.
on:
  push:
    paths:
      - Eval/**
      - Math/**
      - .github/workflows/renderer-eval.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: Eval/RendererEval
        run: xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if "iOS" in k), reverse=True)
          phones = [d for k in runtimes for d in devices[k] if d["name"].startswith("iPhone")]
          print(phones[0]["udid"])')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run the evaluation
        working-directory: Eval/RendererEval
        env:
          TEST_RUNNER_EVAL_DIR: ${{ github.workspace }}/renderer-eval
        run: |
          set -o pipefail
          xcodebuild test \
            -project RendererEval.xcodeproj \
            -scheme RendererEval \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee eval.log | grep -E "Test Case|error:|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" eval.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: renderer-eval
          path: |
            renderer-eval
            Eval/RendererEval/eval.log
          retention-days: 14
