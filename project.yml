name: GlassesSolver

options:
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true

# Bundle ID and the Meta values live in Config/*.xcconfig. Config/Secrets.xcconfig
# is gitignored and written by CI from GitHub Actions secrets.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.0

targets:
  GlassesSolver:
    type: application
    platform: iOS
    sources:
      - GlassesSolver
    settings:
      base:
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      # Experimental in SDK 1.0: fine for Developer Mode, not yet publishable.
      - package: MetaWearablesDAT
        product: MWDATInputs
    scheme:
      testTargets:
        - GlassesSolverTests

  # Unit and integration tests, run on the iOS Simulator in CI (.github/workflows/tests.yml).
  # MWDATMockDevice simulates the glasses: sessions, camera, capture button, touchpad.
  GlassesSolverTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: GlassesSolver
      - package: MetaWearablesDAT
        product: MWDATCore
        embed: false
      - package: MetaWearablesDAT
        product: MWDATCamera
        embed: false
      - package: MetaWearablesDAT
        product: MWDATInputs
        embed: false
      # Not embedded: XcodeGen copies a package binary into a test bundle from the wrong path.
      # Simulator test runs load it from the build products folder instead.
      - package: MetaWearablesDAT
        product: MWDATMockDevice
        embed: false
