name: GlassesSolver

options:
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true

# Bundle ID and the Meta values live in Config/*.xcconfig. Config/Secrets.xcconfig
# is gitignored and written by CI from GitHub Actions secrets.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.0

targets:
  GlassesSolver:
    type: application
    platform: iOS
    sources:
      - GlassesSolver
    settings:
      base:
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
    scheme: {}
